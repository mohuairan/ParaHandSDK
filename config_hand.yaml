ctrl_frequency: 50.0
serial:
  port: COM7
  baudrate: 500000
  timeout_s: 0.05
  write_timeout_s: 0.05
tactile:
  enabled: true
  mode: hwk
  fsr402:
    port: COM8
    baudrate: 115200
    timeout_s: 1.0
    contact_threshold_g: 0.1
    channel_fingers:
    - thumb
    - index
    - middle
    - ring
    - little
  hwk:
    port: COM5
    baudrate: 921600
    response_timeout_s: 0.2
    write_timeout_s: 0.2
    poll_interval_s: 0.0
    contact_threshold_g: 1.0
    device_regions:
      1: thumb
      2: index
      3: middle
      4: ring
      5: little
      6: palm
thumb:
  cmc_1:
    id: 13
    range:
    - 0.0
    - 45.0
    reverse: true
    enabled: true
  cmc_2:
    id: 14
    range:
    - -90.0
    - 40.0
    reverse: false
    enabled: true
  mcp:
    id: 15
    range:
    - -30.0
    - 90.0
    reverse: false
    enabled: true
  ip:
    id: 16
    range:
    - 0.0
    - 90.0
    reverse: false
    enabled: true
index:
  mcp_1:
    id: 5
    range:
    - -30.0
    - 0.0
    reverse: false
    enabled: true
  mcp_2:
    id: 4
    range:
    - 0.0
    - 90.0
    reverse: false
    enabled: true
  pip_dip:
    id: 12
    range:
    - -255.0
    - 255.0
    gui_range_mm:
    - 0.0
    - 25.0
    reverse: false
    enabled: true
middle:
  mcp_1:
    id: 6
    range:
    - -15
    - 15
    reverse: false
    enabled: true
  mcp_2:
    id: 3
    range:
    - 0.0
    - 90.0
    reverse: false
    enabled: true
  pip_dip:
    id: 11
    range:
    - -255.0
    - 255.0
    gui_range_mm:
    - 0.0
    - 25.0
    reverse: false
    enabled: true
ring:
  mcp_1:
    id: 7
    range:
    - -15
    - 15
    reverse: false
    enabled: true
  mcp_2:
    id: 2
    range:
    - 0.0
    - 90.0
    reverse: false
    enabled: true
  pip_dip:
    id: 10
    range:
    - -255.0
    - 255.0
    gui_range_mm:
    - 0.0
    - 25.0
    reverse: true
    enabled: true
